# Local development dependencies only. Nothing here describes how the platform
# is deployed — that lives in the IaC repo (see CLAUDE.md).
# Credentials are deliberately weak and local-only.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctf_local_dev
      POSTGRES_DB: ctf
    ports:
      # Host port 15432, not 5432: Windows reserves 5411-5510 for dynamic
      # allocation (see `netsh int ipv4 show excludedportrange protocol=tcp`),
      # so 5432 cannot be bound on a default Windows host.
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for challenge artifacts. In the cluster this is MinIO too,
  # so any number of API replicas share one store without a ReadWriteMany volume.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ctf_minio
      MINIO_ROOT_PASSWORD: ctf_minio_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
