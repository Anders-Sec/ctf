apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-frontend
  namespace: ctf
  labels: { app: ctf-frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ctf-frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: ctf-frontend }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/anders-sec/ctf-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            # The image already runs as uid 101; stating it here means the
            # cluster refuses the pod if that ever regresses, rather than
            # quietly running a root nginx.
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          # /healthz is served by nginx itself, so a probe never has to reach
          # for the SPA to decide the container is alive.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ctf-frontend
  namespace: ctf
spec:
  selector: { app: ctf-frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
