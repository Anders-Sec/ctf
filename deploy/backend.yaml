apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-backend
  namespace: ctf
  labels: { app: ctf-backend }
spec:
  # Two replicas buy CPU parallelism and rolling restarts. On a single node they
  # are not high availability, and nothing here pretends otherwise.
  replicas: 2
  selector:
    matchLabels: { app: ctf-backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: ctf-backend }
    spec:
      # A named identity so the platform's namespaced RoleBinding in
      # ctf-instances can target it (spec 009). The SA itself is created below.
      serviceAccountName: ctf-backend
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          # Immutable: the tag names the commit the image was built from, and
          # is never repointed. A release is a bump to this line, so ArgoCD
          # shows exactly what is running and a rollback is a git revert. A
          # moving tag would leave the cluster on an old image with the sync
          # reporting healthy, and IfNotPresent would never re-pull it.
          #
          # Pin only a sha CI has already published. A push runs CI once, for
          # the head commit of that push, so the intermediate commits in a
          # multi-commit push are never built and their tags never exist. That
          # makes the bump inherently a follow-up commit: push the work, let
          # the build finish, then pin the sha it produced.
          image: ghcr.io/anders-sec/ctf-backend:sha-b689225 
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          env:
            - { name: ENVIRONMENT, value: "prod" }
            - { name: APP_PUBLIC_URL, value: "https://ctf-nm.org" }
            - { name: COOKIE_SECURE, value: "true" }
            # Same origin, so CORS is never exercised.
            - { name: CORS_ALLOWED_ORIGINS, value: "" }
            - { name: LOG_LEVEL, value: "INFO" }
            - { name: APP_VERSION, value: "v1" }
            - { name: S3_ENDPOINT_URL, value: "http://minio.ctf.svc.cluster.local:9000" }
            - { name: S3_BUCKET, value: "ctf-artifacts" }
            # Stable in-cluster name for the AI host. The platform session keeps
            # the Endpoints pointed at the right address, so this value never
            # changes here even when the host address does.
            - { name: AI_BASE_URL, value: "http://ai.ctf.svc.cluster.local:1235/v1" }
            # The loaded model's id, not a secret and not an address. Without it
            # the assistant reports itself unconfigured and the chat is hidden.
            - name: AI_MODEL
              value: "llama3.3-8b-instruct-thinking-heretic-uncensored-claude-4.5-opus-high-reasoning-i1"

            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: redis-url } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: secret-key } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: minio-access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: minio-secret-key } }
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: smtp-host } }
            - name: SMTP_PORT
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: smtp-port } }
            - name: SMTP_USERNAME
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: smtp-username } }
            - name: SMTP_FROM
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: smtp-from } }
            - name: ENTRA_REDIRECT_URI
              valueFrom: { secretKeyRef: { name: ctf-secrets, key: entra-redirect-uri } }

            # Optional until the human supplies them. Marked optional so the pod
            # starts without Entra, magic-link mail or the AI configured — each
            # feature reports itself unavailable rather than taking the whole
            # platform down at rollout.
            - name: SMTP_TOKEN
              valueFrom:
                secretKeyRef: { name: ctf-secrets, key: smtp-token, optional: true }
            - name: ENTRA_TENANT_ID
              valueFrom:
                secretKeyRef: { name: ctf-secrets, key: entra-tenant-id, optional: true }
            - name: ENTRA_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: ctf-secrets, key: entra-client-id, optional: true }
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: ctf-secrets, key: entra-client-secret, optional: true }
            - name: ENTRA_ENFORCED_EMAIL_DOMAINS
              valueFrom:
                secretKeyRef:
                  { name: ctf-secrets, key: entra-enforced-email-domains, optional: true }
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef: { name: ctf-secrets, key: ai-api-key, optional: true }
            # The event's own hosts, so the safety filter can tell an attack on
            # the crawl (fine) from one on the real company (not). Real internal
            # names must never enter this repo, so it arrives as a secret.
            - name: AI_EVENT_DOMAINS
              valueFrom:
                secretKeyRef: { name: ctf-secrets, key: ai-event-domains, optional: true }

            # --- Live challenge containers (spec 009) ------------------------
            # Off until the cluster side (namespace, RBAC, cert, RuntimeClass)
            # is confirmed. Flip INSTANCES_ENABLED to "true" and set COOKIE_DOMAIN
            # to ctf-nm.org together, as the go-live step.
            - { name: INSTANCES_ENABLED, value: "true" }
            - { name: KUBE_NAMESPACE, value: "ctf-instances" }
            - { name: INSTANCE_BASE_DOMAIN, value: "ctf-nm.org" }
            - { name: INSTANCE_HTTP_MODE, value: "ingress" }
            - { name: INSTANCE_RUNTIME_CLASS, value: "gvisor" }
            # Widen session cookies to the parent domain so the per-instance
            # ingress auth check receives them. Empty = host-only (current). Set
            # to "ctf-nm.org" at go-live, alongside INSTANCES_ENABLED.
            - { name: COOKIE_DOMAIN, value: "ctf-nm.org" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          # Liveness deliberately checks nothing but the process. If it touched
          # Postgres, a brief database blip would restart every pod mid-event.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          # Headroom for migrations on a fresh database: 30 x 5s.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            # The root filesystem is read-only, so anything that writes needs a
            # declared home.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ctf-backend
  namespace: ctf
spec:
  selector: { app: ctf-backend }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctf-backend
  namespace: ctf
