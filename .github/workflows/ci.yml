name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Same versions as docker-compose.yml, so a failure here means a real
      # failure rather than a version skew between CI and a developer's machine.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctf
          POSTGRES_PASSWORD: ctf_local_dev
          POSTGRES_DB: ctf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctf -d ctf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # CI runs on Linux, where the conventional ports are not reserved.
      DATABASE_URL: postgresql://ctf:ctf_local_dev@localhost:5432/ctf
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: local
      APP_VERSION: ${{ github.sha }}
      LOG_LEVEL: WARNING
      CORS_ALLOWED_ORIGINS: ""

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --python 3.12

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
