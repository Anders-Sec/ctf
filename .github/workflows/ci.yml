name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Release tags are what deploy/ pins. Pushing v1 is what puts
    # ghcr.io/anders-sec/ctf-*:v1 in the registry for ArgoCD to pull.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish (e.g. v1). Leave blank to publish only the commit SHA tag."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Same versions as docker-compose.yml, so a failure here means a real
      # failure rather than a version skew between CI and a developer's machine.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctf
          POSTGRES_PASSWORD: ctf_local_dev
          POSTGRES_DB: ctf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctf -d ctf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # CI runs on Linux, where the conventional ports are not reserved.
      DATABASE_URL: postgresql://ctf:ctf_local_dev@localhost:5432/ctf
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: local
      APP_VERSION: ${{ github.sha }}
      LOG_LEVEL: WARNING
      CORS_ALLOWED_ORIGINS: ""

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --python 3.12

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  # Build and push the images the cluster actually pulls. Without this job the
  # manifests in deploy/ reference tags that were never published, and every pod
  # sits in ImagePullBackOff no matter how healthy the sync looks in ArgoCD.
  images:
    runs-on: ubuntu-latest
    # Only publish what already passed lint and tests.
    needs: [backend, frontend]

    permissions:
      contents: read
      # GITHUB_TOKEN is read-only by default, so pushing to GHCR fails without this.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build to prove the Dockerfile still works, but publish
      # nothing: a fork PR has no write access, and unreviewed code has no
      # business in a tag the cluster pulls.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Hardcoded rather than derived from github.repository_owner, which is
          # mixed case (Anders-Sec) while GHCR paths must be lowercase.
          images: ghcr.io/anders-sec/ctf-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          # deploy/ pins explicit tags and the pods run imagePullPolicy:
          # IfNotPresent, so a moving :latest would be both unpinned and unpulled.
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Keeps the package a plain single-platform image instead of an index
          # carrying unknown/unknown attestation entries.
          provenance: false
