name: CI

on:
  pull_request:
  push:
    branches: [main]
    # deploy/ pins the immutable sha-<gitsha> tag, so a release is a manifest
    # bump rather than a git tag. This trigger stays for the occasional named
    # tag; nothing in deploy/ depends on one existing.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish (e.g. v1). Leave blank to publish only the commit SHA tag."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which suites this change can actually affect.
  #
  # The backend suite is ~10 minutes and the frontend is ~2, so a CSS tweak used
  # to cost twelve minutes to prove it had not broken Postgres. This job decides
  # what is worth running; `scripts/verify.sh` is what runs *everything*, locally,
  # before you push.
  #
  # Deliberately a `git diff` rather than a third-party paths-filter action: it
  # is fifteen lines, it is auditable in place, and this repository does not need
  # another supply chain.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      instances: ${{ steps.filter.outputs.instances }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clones cannot diff against the base commit.
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          everything() {
            echo "backend=true"   >> "$GITHUB_OUTPUT"
            echo "frontend=true"  >> "$GITHUB_OUTPUT"
            echo "instances=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A new branch reports an all-zero "before", a dispatch reports none,
          # and a force-push can leave a base we no longer have. **Run
          # everything when in doubt** — the failure mode of guessing wrong is a
          # regression reaching main, and the cost of guessing right is ten
          # minutes.
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) everything ;;
          esac
          git cat-file -e "$BASE^{commit}" 2>/dev/null || everything

          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "Changed:"; echo "$FILES" | sed 's/^/  /'

          # The workflow deciding what to skip is not a thing to skip on.
          if echo "$FILES" | grep -q '^\.github/workflows/'; then everything; fi

          match() { echo "$FILES" | grep -q "$1" && echo true || echo false; }
          {
            echo "backend=$(match '^backend/')"
            echo "frontend=$(match '^frontend/')"
            echo "instances=$(match '^deploy/instances/')"
          } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Same versions as docker-compose.yml, so a failure here means a real
      # failure rather than a version skew between CI and a developer's machine.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctf
          POSTGRES_PASSWORD: ctf_local_dev
          POSTGRES_DB: ctf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctf -d ctf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # CI runs on Linux, where the conventional ports are not reserved.
      DATABASE_URL: postgresql://ctf:ctf_local_dev@localhost:5432/ctf
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: local
      APP_VERSION: ${{ github.sha }}
      LOG_LEVEL: WARNING
      CORS_ALLOWED_ORIGINS: ""

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --python 3.12

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  # A challenge image is only as good as its challenges still being solvable.
  # These tests perform the four intended solutions and check that the routes
  # that must stay shut are still shut, so a regression fails a build rather
  # than an event.
  challenge-images:
    needs: changes
    if: needs.changes.outputs.instances == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web-apothecary
            deps: '"flask==3.0.3"'
          - image: web-registry
            deps: '"flask==3.0.3" "pyjwt==2.9.0"'

    defaults:
      run:
        working-directory: deploy/instances/${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the versions the image installs, so a pass here means a pass
      # in the container.
      - name: Install
        run: pip install ${{ matrix.deps }} pytest

      - name: Test
        run: python -m pytest -q

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Spec 048: no component may name a colour. The token layer was designed
      # for theming from the start and still decayed to ~100 violations, because
      # nothing enforced it. First, so the cheapest failure reports first.
      - name: Colours
        run: npm run lint:colours

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  # Build and push the images the cluster actually pulls. Without this job the
  # manifests in deploy/ reference tags that were never published, and every pod
  # sits in ImagePullBackOff no matter how healthy the sync looks in ArgoCD.
  images:
    runs-on: ubuntu-latest
    # Only publish what already passed lint and tests — including the proof
    # that each challenge image is still solvable.
    needs: [changes, backend, frontend, challenge-images]
    # A *skipped* test job must not skip this one. GitHub propagates "skipped"
    # down `needs` by default, so gating the suites above would otherwise stop
    # images publishing — and since deploy/ pins sha-<gitsha>, the next manifest
    # bump would point at a tag that was never built. That is precisely the
    # ImagePullBackOff this job's comment above exists to prevent.
    #
    # So: run unless something actually **failed** or the run was cancelled.
    # Skipped is a pass here; failed is never one.
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}

    permissions:
      contents: read
      # GITHUB_TOKEN is read-only by default, so pushing to GHCR fails without this.
      packages: write

    # **Every image, every time — the gating above is on tests, not on
    # publishing.** deploy/ pins sha-<gitsha> for each component independently,
    # so a frontend-only commit must still produce a backend image at that sha
    # or bumping backend.yaml to it lands in ImagePullBackOff. The unchanged
    # contexts are cache hits and cost seconds.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
          # The spec 009 challenge-instance demo image, published so a
          # container_template can point at ghcr.io/anders-sec/ctf-demo.
          - name: demo
            context: deploy/instances/demo
          # The four Web Attacks challenges in the apothecary (spec 045).
          - name: web-apothecary
            context: deploy/instances/web-apothecary
          # The other four, including the area boss (spec 047).
          - name: web-registry
            context: deploy/instances/web-registry

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build to prove the Dockerfile still works, but publish
      # nothing: a fork PR has no write access, and unreviewed code has no
      # business in a tag the cluster pulls.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Hardcoded rather than derived from github.repository_owner, which is
          # mixed case (Anders-Sec) while GHCR paths must be lowercase.
          images: ghcr.io/anders-sec/ctf-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          # No moving tags, ever. deploy/ pins sha-<gitsha> and the pods run
          # imagePullPolicy: IfNotPresent, so a tag that silently repoints would
          # leave the cluster on an old image with no way to tell from the
          # manifest -- and ArgoCD would report the sync as healthy.
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Keeps the package a plain single-platform image instead of an index
          # carrying unknown/unknown attestation entries.
          provenance: false
