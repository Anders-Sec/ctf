server {
    # Not 80: the server runs as uid 101, which cannot bind a privileged port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: every unknown path is the SPA, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers on the old
    # bundle pointing at asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The SPA is served from the same origin as the API, so it never needs to
    # be framed or sniffed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lets the platform probe the container without reaching for the SPA.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
