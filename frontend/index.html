<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTF Platform</title>
    <script>
      /*
       * Stamp the theme before the bundle parses (spec 048 §3).
       *
       * Without this every dark-theme user gets a full-brightness parchment
       * flash on every cold load, because the real preference does not arrive
       * until /auth/me resolves. localStorage is a cache of that answer, not
       * the source of truth — the session reconciles it on arrival.
       *
       * Deliberately inline, tiny, and wrapped: localStorage throws outright in
       * some privacy modes, and a theme we cannot read is not a reason to fail
       * to render the page.
       */
      (function () {
        try {
          var stored = window.localStorage.getItem("ctf.theme");
          var known = ["parchment", "dark-dungeon", "torchlight", "high-contrast"];
          if (known.indexOf(stored) === -1) return;
          document.documentElement.setAttribute("data-theme", stored);
          document.documentElement.style.colorScheme =
            stored === "dark-dungeon" || stored === "torchlight" ? "dark" : "light";
        } catch (e) {
          /* No cached preference. The default theme paints correctly. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
